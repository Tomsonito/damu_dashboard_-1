[pytest]
testpaths = tests
# Русские имена тестов — намеренно: отчёт о падении читается как фраза
# на языке проекта, а не как англо-русская смесь. Кириллица в именах
# функций Python допустима с версии 3.0.
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    needs_storage: тесту нужен data/analytics.duckdb (в git его нет)
