# Оформление сайта — значения ПО УМОЛЧАНИЮ.
#
# Админ меняет вид на странице «Настройки», и его выбор ложится в таблицу
# `settings` хранилища ПОВЕРХ этих значений. Обратно в этот файл ничего
# не пишется — намеренно: два админа затирали бы правки друг друга,
# кривой ввод ломал бы YAML, а выкат из git стирал бы настройки.
# Здесь — «как сайт выглядит из коробки», там — «как решили сегодня».
#
#   brand      — надпись в шапке
#   accent     — основной цвет: кнопки, ссылки, галки, первый цвет диаграмм
#   accent_2   — второй цвет: кредитование и проценты
#   accent_3   — третий цвет: субсидирование. Понадобился, когда инструментов
#                стало три: зелёный и золотой на два уже были заняты,
#                а третий оттенок золота с ними сливался
#   navbar     — шапка: dark (тёмная) | light (светлая) | accent (в цвет)
#   font       — ключ набора из блока fonts ниже
#   font_scale — ключ размера из блока font_scales ниже
#   logo       — имя файла картинки в assets/; пусто — только текст
#
# Значения ниже — из макета Claude Design (дизайн-система «Modernist»):
# зелёный + золотистый, как на боевом портале tablo.fund.kz.
theme:
  brand: "Аналитический дашборд"
  accent: "#1f7a4d"
  accent_2: "#b08a2e"
  accent_3: "#008b8a"
  navbar: light
  font: golos
  font_scale: normal
  # Файл ждём в assets/logo.png. Пока его нет, строка ничего не ломает:
  # core/theme.py проверяет наличие файла и молча показывает одно название.
  # Положили файл — логотип появится сам, перезапуск не нужен.
  logo: "logo.png"

# Наборы шрифтов, между которыми выбирает админ.
#
# Готовые наборы вместо «полной свободы» — осознанно: каждая свободная
# настройка стоит проверки ввода и хранения, а результат предсказуем —
# кто-нибудь поставит 8 пикселей на белом.
#
# !! Каждый набор обязан иметь кириллицу и знак ₸. Сеть внутренняя,
# Google Fonts недоступны, поэтому шрифт либо уже стоит в системе, либо
# лежит у нас в assets/fonts/ и описан @font-face в assets/custom.css —
# как Golos Text ниже. Свой шрифт компании добавляется так же: файл
# в assets/fonts/, @font-face в custom.css и строка сюда — страница
# настроек подхватит его сама, править её не нужно.
fonts:
  golos:
    label: "Гротеск — Golos Text"
    # @@ Взят вместо Archivo из макета: у Archivo нет кириллицы вообще
    # (Google Fonts отдаёт только latin, latin-ext, vietnamese — проверено
    # 29.07.2026), русский текст им не написать. Golos Text — гротеск
    # Паратайпа, рисовался от кириллицы. Пользователь просил вернуться
    # к вопросу о шрифте позже.
    stack: "'Golos Text', system-ui, 'Segoe UI', sans-serif"
  system:
    label: "Системный"
    stack: "system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  grotesque:
    label: "Гротеск — Verdana"
    stack: "Verdana, 'DejaVu Sans', Tahoma, Geneva, sans-serif"
  serif:
    label: "С засечками — Georgia"
    stack: "Georgia, 'Times New Roman', 'PT Serif', serif"

# Базовый размер шрифта. Всё остальное на странице задано в rem,
# поэтому одна эта величина тянет за собой весь масштаб текста.
font_scales:
  compact:
    label: "Компактный"
    size: "14px"
  normal:
    label: "Обычный"
    size: "16px"
  large:
    label: "Крупный"
    size: "18px"

# Размеры виджета на главном экране — готовые пресеты, а не свободные числа.
#
#   columns — сколько колонок из 12 занимает виджет (сетка Bootstrap):
#             4 — три в ряд, 6 — два в ряд, 12 — во всю ширину
#   height  — высота диаграммы в пикселях
#
# !! Диаграмма подгоняется под пресет, а не наоборот: высоту, которую вид
# просит для себя (карта, лучи), при показе в виджете перебивает эта.
widget_sizes:
  small:
    label: "Маленький — три в ряд"
    columns: 4
    height: 320
  medium:
    label: "Средний — два в ряд"
    columns: 6
    height: 420
  large:
    label: "Большой — во всю ширину"
    columns: 12
    height: 700
  # Ширина как у большого, высота как у среднего. Заведён 11.08.2026 для
  # подсекций «Динамика по годам» у СЭЭ: там один график на подсекцию, ему
  # нужна вся ширина, а 700 px высоты не помещались на экран вместе
  # с липкой шапкой и карточкой-показателем — приходилось прокручивать,
  # чтобы увидеть низ столбцов.
  wide:
    label: "Широкий — во всю ширину, пониже"
    columns: 12
    height: 420
  compact_wide:
    label: "Компактный широкий — динамика СЭЭ 2"
    columns: 12
    height: 190
  # Ширина как у среднего (2 в ряд), высота больше. Заведён 12.08.2026 для
  # «Регионов»/«Отраслей» у СЭЭ: список из 20 областей при шрифте не мельче
  # 16 px (правило пользователя — иначе подписи нечитаемы) в среднем
  # пресете (420 px) даёт только 16,9 px на строку при пороге ~20 —
  # строки касались друг друга. 500 px дают 20,9 px на строку с запасом.
  medium_tall:
    label: "Средний повыше — два в ряд, для длинных списков"
    columns: 6
    height: 500

# !! БЛОК ПОКА НЕ ДЕЙСТВУЕТ (с 29.07.2026): сетку виджетов с главной убрали,
# там теперь витрина инструментов по макету. Блок оставлен на случай, если
# сетка на главную вернётся — тогда вернуть строку «Главная (витрина)»
# в core/widgets.py, page_choices(). Наборы разделов берутся из
# `section_widgets` ниже, и они работают.
#
# Набор виджетов ПО УМОЛЧАНИЮ — что видит тот, кто ещё ничего не настраивал.
# Как только админ правит набор на странице «Виджеты», список переезжает
# в таблицу `widgets` хранилища и этот блок больше не действует. Кнопка
# «Вернуть набор по умолчанию» возвращает управление сюда.
# Верхний ряд — общие цифры по стране (без разбивки по областям),
# ниже — подробные разрезы. Порядок здесь = порядок на экране.
default_widgets:
  - {chart: total,      indicator: budget_sme_registered, size: small}
  - {chart: gauge,      indicator: budget_execution,      size: small}
  - {chart: total,      indicator: budget_spent,          size: small}
  - {chart: bar,        indicator: budget_allocated,      size: large}
  - {chart: months,     indicator: budget_spent,          size: medium}
  - {chart: years_total, indicator: budget_sme_registered, size: medium}

# Набор виджетов ПО УМОЛЧАНИЮ для страницы раздела — общий для всех
# разделов (так решено: разделы одинаковые). Показатели здесь свои,
# разделовские: на главной витрине живут бюджетные, а внутри раздела —
# его собственные план, факт, выдача.
#
# Админ может собрать любому разделу свой набор на странице «Виджеты» —
# тогда для этого раздела список ниже перестаёт действовать.
section_widgets:
  - {chart: total,       indicator: demo_plan,      size: small}
  - {chart: gauge,       indicator: demo_execution, size: small}
  - {chart: total,       indicator: demo_issued,    size: small}
  - {chart: bar,         indicator: demo_plan,      size: large}
  - {chart: months,      indicator: demo_fact,      size: medium}
  - {chart: years_total, indicator: demo_issued,    size: medium}

# Свой набор виджетов для конкретной пары раздел:вкладка — ключ склеен
# двоеточием, как в core/widgets.page_key(). Заведено 04.08.2026 при
# переносе «Описание разделов.md»: у общего `section_widgets` выше шесть
# виджетов сразу (карточки план/освоение/выдано и диаграммы под ними) —
# было верно, пока у раздела была одна общая вкладка. Теперь у вкладки
# «Динамика по годам» уже есть свои карточки-показатели (`kpi` у вкладки
# в `section_tabs_by_section`), и те же план/освоение/выдано повторялись
# бы дважды на одном экране. У «Регионы»/«ОКЭД» — другая причина: документ
# называет там только ОДНУ настоящую диаграмму («Регионы»), а не шесть.
#
# !! Список может быть **пустым** — `[]` — и это осознанно, а не
# недосмотр: у вкладки нет своей записи здесь — берётся общий
# `section_widgets`; есть запись с `[]` — виджетов на ней нет, потому что
# документ для неё не назвал ни одной диаграммы, которую есть на чём
# построить. Дописывать вкладку с пустым списком «просто чтобы было» —
# значит вернуть тот же общий набор, от которого и уходили.
section_widgets_by_page:
  # «Динамика по годам» — документ хочет «1 диаграмма (динамика в разрезе
  # годов)», а показатели (проекты, уникальные заёмщики, суммы кредитов
  # и гарантий) взять неоткуда — ни в боевых, ни в демо-данных таких нет.
  # `years_total` на «Факт» — тот же принцип, что у kpi-карточек этой
  # вкладки: показывает динамику по годам честно, под своей подписью,
  # не выдавая её за то, чего документ на самом деле просит.
  # !! Размер здесь — ключ из `widget_sizes` выше: small / medium / large.
  # Стояло `normal`, такого пресета нет, и `size_meta` молча подставлял
  # средний. Ошибки не было, но и настройка не действовала: чтобы поменять
  # размер, надо писать существующее имя.
  # «Динамика по годам» у СЭЭ разбита на четыре подсекции, у каждой свой
  # график во всю ширину (08.08.2026). Ключ здесь — «раздел:вкладка»,
  # а вкладка теперь своя у каждого показателя.
  #
  # `recent_years: 5` — только у СЭЭ («работаем только с СЭЭ», Гар. выдачу
  # и Кредит. выдачу пока не трогаем). График показывает последние пять лет
  # С ДАННЫМИ у своего показателя (не пять календарных — у СЭЭ история
  # обрывается на 2024-м), кнопка «Показать динамику» разворачивает до всех.
  # Ширину кнопка больше не меняет: график и так во всю линию.
  # Разбор — CODE_GUIDE, «Динамика по годам: свёрнутый вид».
  # !! Размер `wide`, а не `large` (11.08.2026, замечание пользователя):
  # ширина та же — во всю линию, а высота 420 вместо 700. С 700 график
  # не помещался на экран целиком вместе с липкой шапкой и карточкой-
  # показателем, и было «не видно, где что».
  # `test_months` (18.08.2026, просьба пользователя «придумай числа, чтобы
  # разбивка работала») — тот же приём, что у СЭЭ 2 ниже: у СЭЭ в источнике
  # только декабрь, и без него клик по году показывал бы отказ вместо
  # разбивки. Раскрытие помечено на экране «тестовые месяцы» — это не
  # подмена источника молча, а тот же явный флаг виджета, что и у СЭЭ 2.
  see:years_output: [{chart: years_total, indicator: see_output,       size: wide, recent_years: 5, test_months: true}]
  see:years_jobs:   [{chart: years_total, indicator: see_jobs_created, size: wide, recent_years: 5, test_months: true}]
  see:years_tax:    [{chart: years_total, indicator: see_tax_revenue,  size: wide, recent_years: 5, test_months: true}]
  see:years_saved:  [{chart: years_total, indicator: see_jobs_saved,   size: wide, recent_years: 5, test_months: true}]
  guarantee:years:     [{chart: years_total, indicator: guarantees_issued, size: large}]
  credit:years:        [{chart: years_total, indicator: credits_issued, size: large}]
  subsidy:years:        [{chart: years_total, indicator: subsidy_project_amount, size: large}]

  # «Регионы»/«ОКЭД и регионы» — единственная настоящая диаграмма, которую
  # документ здесь называет и на которую есть данные: разбивка по областям.
  # ОКЭД (вторая половина смысла у большинства этих вкладок) — по-прежнему
  # макетная карточка `oked_card()` в pages/section.py, не виджет.
  # !! Во всю ширину (`large`), по одной в ряд — и это следствие шрифта.
  # Пользователь выбрал 11.08.2026 читаемость: подписи в диаграммах
  # не мельче 16 px («сейчас глаза болят»). При 16 px строка просит около
  # 20 px, двадцать областей — 400 px только под полосы. В сетке 2×2
  # такое не помещается, поэтому от неё отказались осознанно: сначала
  # читаемость, потом «всё на одном экране». Вернуть сетку можно, лишь
  # вернув мелкий шрифт.
  # !! Размер `medium` (2 в ряд), а не `large` (11.08.2026, просьба
  # пользователя). Ранее стояло `large` из-за шрифта 16 px и длинных
  # подписей регионов/отраслей, но пользователь предпочёл компактность.
  see:regions:
    - {chart: bar, indicator: see_output, size: medium_tall}
    - {chart: bar, indicator: see_jobs_created, size: medium_tall}
    - {chart: bar, indicator: see_tax_revenue, size: medium_tall}
    - {chart: bar, indicator: see_jobs_saved, size: medium_tall}
  see:industries:
    - {chart: industries, indicator: see_output_industry, size: medium_tall}
    - {chart: industries, indicator: see_jobs_created_industry, size: medium_tall}
    - {chart: industries, indicator: see_tax_revenue_industry, size: medium_tall}
    # !! Один из четырёх — на алфавитный вид (`industries_alpha`), для
    # сравнения рядом с обычным «по значению» (просьба пользователя
    # 13.08.2026). Остальные три остались как были.
    - {chart: industries_alpha, indicator: see_jobs_saved_industry, size: medium_tall}
  # СЭЭ 2 использует данные СЭЭ, но раскладывает разрезы по новому макету.
  # `test_months` создаёт помесячные значения в памяти из годового итога.
  # Они нужны только для проверки раскрытия в СЭЭ 2 и помечаются на экране.
  see2:years_output: [{chart: years_total, indicator: see_output,       size: compact_wide, recent_years: 6, test_months: true, compact_years: true}]
  see2:years_jobs:   [{chart: years_total, indicator: see_jobs_created, size: compact_wide, recent_years: 6, test_months: true, compact_years: true}]
  see2:years_tax:    [{chart: years_total, indicator: see_tax_revenue,  size: compact_wide, recent_years: 6, test_months: true, compact_years: true}]
  see2:years_saved:  [{chart: years_total, indicator: see_jobs_saved,   size: compact_wide, recent_years: 6, test_months: true, compact_years: true}]
  see2:industries:
    - {chart: industries, indicator: see_output_industry, size: medium_tall}
    - {chart: industries, indicator: see_jobs_created_industry, size: medium_tall}
    - {chart: industries, indicator: see_tax_revenue_industry, size: medium_tall}
    - {chart: industries_alpha, indicator: see_jobs_saved_industry, size: medium_tall}
  see2:regions:
    - {chart: bar, indicator: see_output, size: medium_tall}
    - {chart: bar, indicator: see_jobs_created, size: medium_tall}
    - {chart: bar, indicator: see_tax_revenue, size: medium_tall}
    - {chart: bar, indicator: see_jobs_saved, size: medium_tall}
  # !! Ключ «раздел:вкладка» должен встречаться в этом блоке РОВНО ОДИН РАЗ.
  # YAML на дубль не ругается — молча побеждает последний. Поймано
  # 07.08.2026: `orleu:terms` оказался объявлен дважды, и вкладка «Цели
  # займа/БВУ/Субъектность» показывала один график по областям вместо
  # четырёх разрезов. Ошибки при этом не было нигде.
  #
  # Разрезы, приехавшие 07.08.2026 из тех же файлов: ОКЭД, БВУ,
  # субъектность и цели займа лежали в выгрузках с самого начала, разборщик
  # просто читал из них четыре колонки из шестнадцати. Вкладки под них уже
  # были нарисованы по «Описанию разделов» и стояли с заглушкой.
  #
  # Отрасли — во всю ширину: категорий 17–19, а на «среднем» пресете
  # (420 px) это 22–25 px на строку — подписи ещё влезали, но впритык.
  # Остальные разрезы (субъектность, цели) — по три-четыре значения,
  # им большая карточка не нужна.
  #
  # !! Банки — тоже во всю ширину, и это не запас, а необходимость:
  # у «Гар. выдачи» их 28. На среднем пресете (420 px) выходило по 7,4 px
  # на строку, и Plotly в ответ прятал ПОЛОВИНУ подписей — 14 из 28,
  # столбцы оставались все, а какой банк к какому относится, было не
  # понять (поймано пользователем 07.08.2026 на скриншоте — «нечитаемые
  # числа»). На большом пресете (700 px) — 25 px на строку, весь список
  # виден. У «Кредит. выдачи» банков 15 и у «Өрлеу» 7 — там строка ниже
  # порога и осталась средней, трогать незачем.
  guarantee:regions:
    - {chart: bar,        indicator: guarantees_issued, size: medium}
    - {chart: industries, indicator: guarantees_issued, size: large}
  guarantee:programs:
    - {chart: programs,   indicator: guarantees_issued, size: medium}
    - {chart: purposes,   indicator: guarantees_issued, size: medium}
  guarantee:banks:
    - {chart: banks,      indicator: guarantees_issued, size: large}
    - {chart: subjects,   indicator: guarantees_issued, size: medium}
  credit:programs:
    - {chart: programs,   indicator: credits_issued, size: medium}
    - {chart: purposes,   indicator: credits_issued, size: medium}
  credit:banks:
    - {chart: banks,      indicator: credits_issued, size: medium}
    - {chart: subjects,   indicator: credits_issued, size: medium}
  # Өрлеу: вкладки назывались «Цели займа/БВУ/Субъектность» и «ОКЭД/Регионы»,
  # а показывали трижды один и тот же график по областям — своих виджетов
  # у них не было, и брался общий набор
  orleu:terms:
    - {chart: purposes,   indicator: credits_issued, size: medium}
    - {chart: banks,      indicator: credits_issued, size: medium}
    - {chart: subjects,   indicator: credits_issued, size: medium}
    - {chart: programs,   indicator: credits_issued, size: medium}
  guarantee_debt:regions: [{chart: bar, indicator: demo_fact, size: large}]
  credit:regions:
    - {chart: bar,        indicator: credits_issued, size: medium}
    - {chart: industries, indicator: credits_issued, size: large}
  orleu:status:         [{chart: bar, indicator: credits_issued, size: large}]
  orleu:regions:
    - {chart: bar,        indicator: credits_issued, size: medium}
    - {chart: industries, indicator: credits_issued, size: large}
  subsidy:regions:
    - {chart: bar,        indicator: subsidy_project_amount, size: medium}
    - {chart: industries, indicator: subsidy_project_amount, size: large}
  subsidy:programs:
    - {chart: programs,   indicator: subsidy_project_amount, size: medium}
    - {chart: purposes,   indicator: subsidy_project_amount, size: medium}
  subsidy:banks:
    - {chart: banks,      indicator: subsidy_project_amount, size: large}
    - {chart: subjects,   indicator: subsidy_project_amount, size: medium}
  subsidy_debt:regions: [{chart: bar, indicator: demo_fact, size: large}]
  subsidy_pay:regions:  [{chart: bar, indicator: demo_fact, size: large}]

# Настройки диаграмм
charts:
  # Минимальный размер сектора на круговой, плитках, лучах и сосульках —
  # в процентах от самого крупного сектора. Мелкие регионы подтягиваются
  # до этого размера, иначе подпись в них не помещается.
  #
  # Компромисс: площадь перестаёт быть строго пропорциональна значению.
  # Чтобы это не вводило в заблуждение, числа в подписях и подсказках
  # остаются настоящими, а в заголовке появляется пометка.
  # 0 — не подтягивать, площади строго пропорциональны.
  min_slice_percent: 10

# Карта: файл границ областей и имя поля в нём, по которому искать регион.
# Файла пока нет — вид «Карта» покажет подсказку, что положить.
#
# Лежит в assets/, а не в data/: data/ восстанавливается запуском ETL и потому
# в git не попадает, а границы так не восстановишь — их надо возить с проектом.
# Файл читается с диска, наружу за ним никто не ходит: дашборд во внутренней
# сети без интернета, и карта обязана работать без него.
geo:
  geojson_path: "assets/geo/kaz_admbnda_adm1_2024.json"
  # В файле названия лежат в трёх вариантах: ADM1_EN, ADM1_KK, ADM1_RU.
  # Берём русский — он ближе всего к тому, что в данных.
  feature_key: "properties.ADM1_RU"

  # Из двадцати областей четырнадцать называются одинаково, шесть — по-разному.
  # Здесь только расхождения: как у нас -> как в файле границ.
  # Остальные подставляются как есть.
  region_map:
    Абай: Абайская
    Жетісу: Жетысуская
    Ұлытау: Улытауская
    "г. Алматы": Алматы
    "г. Астана": Астана
    "г. Шымкент": Чимкент      # в файле старое написание, через Ч
