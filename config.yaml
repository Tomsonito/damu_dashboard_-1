# Реестр показателей: как называть, в чём измерять, как показывать.
# Добавить показатель = добавить блок сюда. Код страниц не меняется.
#
#   title        — полное название, для подписей осей и подсказок
#   short        — короткое, для карточек
#   unit         — единица измерения в исходных данных
#   kind         — stock: срез на дату | flow_ytd: накоплено с начала года
#   divisor      — на сколько делить перед показом
#   display_unit — что писать после числа
#   decimals     — знаков после запятой
#   agg          — как сворачивать несколько строк в одну (помесячные данные
#                  за год): sum — сложить, last — взять на последнюю дату,
#                  mean — среднее. По умолчанию sum.

indicators:
  registered_smb:
    title: "Зарегистрированные субъекты МСП"
    short: "Зарегистрировано"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0

  active_smb:
    title: "Действующие субъекты МСП"
    short: "Действующих"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0

  employed:
    title: "Численность занятых в МСП"
    short: "Занятых"
    unit: "человек"
    kind: stock
    divisor: 1
    display_unit: "чел."
    decimals: 0

  output:
    title: "Выпуск продукции субъектами МСП"
    short: "Выпуск продукции"
    unit: "млн тенге"
    kind: flow_ytd
    divisor: 1000000
    display_unit: "трлн ₸"
    decimals: 2
    agg: last

  # --- Из БД test_ai, помесячные таблицы budget_regions_ММ.ГГ ---
  # Внимание: budget_sme_* меряют то же, что registered_smb/active_smb выше,
  # но другим методом и за другой период — цифры не сходятся. Это разные
  # показатели, сливать их в один нельзя.

  budget_allocated:
    title: "Выделено бюджета"
    short: "План (выделено)"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  budget_spent:
    title: "Освоено бюджета"
    short: "Факт (освоено)"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  # Производный показатель: в данных его нет, считается из двух других.
  # В исходных таблицах была готовая колонка execution_percent — её не берём
  # осознанно: производное надо считать из частей, иначе однажды разойдётся.
  #
  # Пока процент считается «от плана за прошедшие месяцы»: и план, и факт
  # берутся за загруженные месяцы года. Если заказчик решит «от годового
  # плана» — правка здесь не поможет, надо будет менять расчёт в get_kpi.
  budget_execution:
    title: "Освоение бюджета — факт от плана"
    short: "Согласно плану"
    unit: "%"
    kind: ratio
    divisor: 1
    display_unit: "%"
    decimals: 1
    derived:
      numerator: budget_spent        # факт — освоено
      denominator: budget_allocated  # план — выделено

  subsidies_issued:
    title: "Выдано субсидий"
    short: "Субсидии"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 2
    agg: sum

  workplaces_created:
    title: "Создано рабочих мест"
    short: "Рабочих мест"
    unit: "мест"
    kind: flow
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: sum

  budget_sme_registered:
    title: "Зарегистрировано МСП (данные БД)"
    short: "Зарег. (БД)"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: last

  budget_sme_active:
    title: "Действующих МСП (данные БД)"
    short: "Действ. (БД)"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: last

  avg_execution_days:
    title: "Средний срок освоения"
    short: "Срок освоения"
    unit: "дней"
    kind: stock
    divisor: 1
    display_unit: "дней"
    decimals: 0
    agg: mean

  # --- ДЕМОНСТРАЦИОННЫЕ показатели (макет разделов) -------------------
  # !! Числа выдуманы генератором `python -m etl.make_samples`, к настоящим
  # показателям Фонда отношения не имеют. Живут в отдельной таблице
  # `demo_facts` и подмешиваются только при `demo_data: true` ниже.
  # Коды нарочно свои (demo_*): сложиться с настоящими в одну сумму
  # они не могут. Когда придут реальные данные по разделам — эти пять
  # блоков удаляются, и всё, что на них построено, исчезает вместе с ними.
  demo_plan:
    title: "План"
    short: "План"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  demo_fact:
    title: "Факт"
    short: "Факт"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  demo_issued:
    title: "Выдано"
    short: "Выдано"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  demo_contracts:
    title: "Договоров"
    short: "Договоров"
    unit: "штук"
    kind: flow
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: sum

  demo_jobs:
    title: "Рабочих мест"
    short: "Рабочих мест"
    unit: "мест"
    kind: flow
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: sum

  # Остаток = план минус факт. Второй вид производного показателя:
  # не доля, а разность. В данных его нет, считается на лету.
  demo_rest:
    title: "Остаток"
    short: "Остаток"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    difference: [demo_plan, demo_fact]

  # Производная к демо-показателям: та же механика, что у «Согласно плану»
  demo_execution:
    title: "Освоение — факт от плана"
    short: "Освоение"
    unit: "%"
    kind: ratio
    divisor: 1
    display_unit: "%"
    decimals: 1
    derived:
      numerator: demo_fact
      denominator: demo_plan

# Порядок карточек на главном экране.
# Показатели, которых нет в загруженных данных, пропускаются молча —
# так реестр может описывать больше источников, чем подключено сейчас.
kpi_order: [budget_allocated, budget_spent, budget_execution, subsidies_issued, workplaces_created]

# Группировка областей в макрорегионы — для диаграмм «структура»
# (солнечные лучи, каскад). Деление условное, поправьте под принятое у вас.
macroregions:
  Север: [Акмолинская, Костанайская, Павлодарская, Северо-Казахстанская, "г. Астана"]
  Юг: [Жамбылская, Кызылординская, Туркестанская, "г. Шымкент"]
  Юго-восток: [Алматинская, Жетісу, "г. Алматы"]
  Запад: [Актюбинская, Атырауская, Западно-Казахстанская, Мангистауская]
  Восток: [Восточно-Казахстанская, Абай]
  Центр: [Карагандинская, Ұлытау]

# !! ДЕМОНСТРАЦИОННЫЕ ДАННЫЕ — переключатель макета.
#
# true  — к настоящим фактам подмешиваются выдуманные строки из таблицы
#         `demo_facts`, чтобы разделы меню не стояли пустыми;
# false — сайт показывает только реальные данные, демо-таблица остаётся
#         лежать нетронутой.
#
# Одна строка выключает весь макет. Перед показом с настоящей базой —
# поставить false (или удалить таблицу: DROP TABLE demo_facts).
# Откуда берутся числа: python -m etl.make_samples
demo_data: true

# Вкладки-разрезы внутри раздела — ряд вкладок на странице раздела.
# Взяты с боевого портала: там раздел смотрят под этими углами.
#
#   key   — попадает в ключ набора виджетов (раздел:вкладка)
#   title — надпись на вкладке
#   data  — есть ли под этот разрез данные. Нет — на месте диаграмм
#           появляются полосатые заглушки, а не пустые рамки.
#   group — необязательная группа. Вкладки с одинаковым `group`
#           сворачиваются в ОДНУ вкладку верхнего уровня с этим названием,
#           а при выборе раскрываются отдельным рядом «пилюль» под ней
#           (вариант 5b из макета). Нужно, когда разрезов много и в один
#           ряд они не читаются.
#
# Вкладка НЕ переключает содержимое: страница раздела — одна длинная лента,
# вкладка прокручивает её к своей секции, а при прокрутке мышью сама
# подсвечивается нужная. Так сделано в макете, так же на боевом портале.
#
# !! Сейчас данные есть только под два разреза: годы и регионы. Программы,
# ОКЭД, БВУ и бюджет ждут источника — колонки под них в таблице фактов
# заведены (`program`, `instrument`), но пусты.
section_tabs:
  - {key: years,    title: "Динамика по годам",      data: true}
  - {key: programs, title: "Программы/Цели займа",   data: false}
  - {key: regions,  title: "ОКЭД/Регионы",           data: true}
  - {key: banks,    title: "БВУ/Субъектность",       data: false}
  - {key: budget,   title: "Бюджет",                 data: false}

# Свой набор вкладок для отдельного раздела. Ключ — ключ раздела из
# `sections`. Чего здесь нет — берёт общий `section_tabs` выше.
#
# Пока переопределён один раздел, «Гар. выдача»: ровно он показан в макете
# (страница 5b) с девятью разрезами, четыре из которых собраны в группу ГФ1.
# Остальные разделы живут на общем списке — они устроены одинаково.
section_tabs_by_section:
  guarantee:
    - {key: years,       title: "Динамика по годам",     data: true}
    - {key: programs,    title: "Программа/цели займа",  data: false}
    - {key: plan,        title: "План/освоение",         data: false}
    - {key: regions,     title: "ОКЭД/Регионы",          data: true}
    - {key: banks,       title: "БВУ/субъектность",      data: false}
    - {key: gf1_limits,  title: "Лимиты",        group: "ГФ1", data: false}
    - {key: gf1_spent,   title: "Освоение",      group: "ГФ1", data: false}
    - {key: gf1_pipe,    title: "Пайп",          group: "ГФ1", data: false}
    - {key: gf1_capital, title: "Капитализация", group: "ГФ1", data: false}

# Карточки на странице раздела — как на портале: план, освоено, остаток
# и процент. Показатели берутся из реестра `indicators` выше.
section_kpi: [demo_plan, demo_fact, demo_rest, demo_execution]

# Какие разделы вынесены вкладками наверх — те, куда ходят чаще всего.
# Остальные никуда не деваются: они в списке «Все разделы», который
# открывается поверх страницы. Ключи — из блока `sections` ниже.
main_tabs: [subsidy, credit, guarantee, nonfin]

# Разделы сайта. Порядок здесь = порядок во всплывающем списке.
#
#   key   — латиницей, попадает в адрес страницы (/section/plan)
#   title — как называется в меню
#   data  — есть ли под разделом данные. Раздел без данных показывает
#           заглушку «ждёт источника», а в меню выглядит приглушённым:
#           лучше честно сказать, что пусто, чем дать человеку тыкаться
#
# Значение `title` должно совпадать с колонкой «программа» в данных —
# по нему страница и отбирает свои строки.
sections:
  - {key: plan,          title: "План освоения",     data: true}
  - {key: see,           title: "СЭЭ",               data: true}
  - {key: guarantee,     title: "Гар. выдача",       data: true}
  - {key: gf2,           title: "ГФ2",               data: true}
  - {key: guarantee_debt, title: "Гар. — Осн. долг", data: true}
  - {key: credit,        title: "Кредит. выдача",    data: true}
  - {key: orleu,         title: "Өрлеу",             data: true}
  - {key: subsidy,       title: "Суб. выдача",       data: true}
  - {key: subsidy_debt,  title: "Суб. — Осн. долг",  data: true}
  - {key: subsidy_pay,   title: "Суб. — Выплаты",    data: true}
  - {key: finance,       title: "Фин. показатели",   data: true}
  - {key: treasury,      title: "Казначейство",      data: true}
  - {key: procurement,   title: "Закупки",           data: true}
  - {key: risk,          title: "Риск-менеджмент",   data: true}
  - {key: monitoring,    title: "Мониторинг",        data: true}
  - {key: nonfin,        title: "Нефин. поддержка",  data: true}
  - {key: marketing,     title: "Маркетинг",         data: true}
  - {key: bad_assets,    title: "Пробл. активы",     data: true}
  - {key: staff,         title: "Персонал",          data: true}
  - {key: skpd,          title: "СКПД",              data: true}

# Оформление сайта — значения ПО УМОЛЧАНИЮ.
#
# Админ меняет вид на странице «Настройки», и его выбор ложится в таблицу
# `settings` хранилища ПОВЕРХ этих значений. Обратно в этот файл ничего
# не пишется — намеренно: два админа затирали бы правки друг друга,
# кривой ввод ломал бы YAML, а выкат из git стирал бы настройки.
# Здесь — «как сайт выглядит из коробки», там — «как решили сегодня».
#
#   brand      — надпись в шапке
#   accent     — основной цвет: кнопки, ссылки, галки, первый цвет диаграмм
#   accent_2   — второй цвет: им помечены инструменты, отличные от главного
#                (в макете зелёный — «Все инструменты», золотой — остальные)
#   navbar     — шапка: dark (тёмная) | light (светлая) | accent (в цвет)
#   font       — ключ набора из блока fonts ниже
#   font_scale — ключ размера из блока font_scales ниже
#   logo       — имя файла картинки в assets/; пусто — только текст
#
# Значения ниже — из макета Claude Design (дизайн-система «Modernist»):
# зелёный + золотистый, как на боевом портале tablo.fund.kz.
theme:
  brand: "Аналитический дашборд"
  accent: "#1f7a4d"
  accent_2: "#b08a2e"
  navbar: light
  font: golos
  font_scale: normal
  # Файл ждём в assets/logo.png. Пока его нет, строка ничего не ломает:
  # core/theme.py проверяет наличие файла и молча показывает одно название.
  # Положили файл — логотип появится сам, перезапуск не нужен.
  logo: "logo.png"

# Наборы шрифтов, между которыми выбирает админ.
#
# Готовые наборы вместо «полной свободы» — осознанно: каждая свободная
# настройка стоит проверки ввода и хранения, а результат предсказуем —
# кто-нибудь поставит 8 пикселей на белом.
#
# !! Каждый набор обязан иметь кириллицу и знак ₸. Сеть внутренняя,
# Google Fonts недоступны, поэтому шрифт либо уже стоит в системе, либо
# лежит у нас в assets/fonts/ и описан @font-face в assets/custom.css —
# как Golos Text ниже. Свой шрифт компании добавляется так же: файл
# в assets/fonts/, @font-face в custom.css и строка сюда — страница
# настроек подхватит его сама, править её не нужно.
fonts:
  golos:
    label: "Гротеск — Golos Text"
    # @@ Взят вместо Archivo из макета: у Archivo нет кириллицы вообще
    # (Google Fonts отдаёт только latin, latin-ext, vietnamese — проверено
    # 29.07.2026), русский текст им не написать. Golos Text — гротеск
    # Паратайпа, рисовался от кириллицы. Пользователь просил вернуться
    # к вопросу о шрифте позже.
    stack: "'Golos Text', system-ui, 'Segoe UI', sans-serif"
  system:
    label: "Системный"
    stack: "system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  grotesque:
    label: "Гротеск — Verdana"
    stack: "Verdana, 'DejaVu Sans', Tahoma, Geneva, sans-serif"
  serif:
    label: "С засечками — Georgia"
    stack: "Georgia, 'Times New Roman', 'PT Serif', serif"

# Базовый размер шрифта. Всё остальное на странице задано в rem,
# поэтому одна эта величина тянет за собой весь масштаб текста.
font_scales:
  compact:
    label: "Компактный"
    size: "14px"
  normal:
    label: "Обычный"
    size: "16px"
  large:
    label: "Крупный"
    size: "18px"

# Размеры виджета на главном экране — готовые пресеты, а не свободные числа.
#
#   columns — сколько колонок из 12 занимает виджет (сетка Bootstrap):
#             4 — три в ряд, 6 — два в ряд, 12 — во всю ширину
#   height  — высота диаграммы в пикселях
#
# !! Диаграмма подгоняется под пресет, а не наоборот: высоту, которую вид
# просит для себя (карта, лучи), при показе в виджете перебивает эта.
widget_sizes:
  small:
    label: "Маленький — три в ряд"
    columns: 4
    height: 320
  medium:
    label: "Средний — два в ряд"
    columns: 6
    height: 420
  large:
    label: "Большой — во всю ширину"
    columns: 12
    height: 700

# Набор виджетов ПО УМОЛЧАНИЮ — что видит тот, кто ещё ничего не настраивал.
# Как только админ правит набор на странице «Виджеты», список переезжает
# в таблицу `widgets` хранилища и этот блок больше не действует. Кнопка
# «Вернуть набор по умолчанию» возвращает управление сюда.
# Верхний ряд — общие цифры по стране (без разбивки по областям),
# ниже — подробные разрезы. Порядок здесь = порядок на экране.
default_widgets:
  - {chart: total,      indicator: budget_sme_registered, size: small}
  - {chart: gauge,      indicator: budget_execution,      size: small}
  - {chart: total,      indicator: budget_spent,          size: small}
  - {chart: bar,        indicator: budget_allocated,      size: large}
  - {chart: months,     indicator: budget_spent,          size: medium}
  - {chart: years_total, indicator: budget_sme_registered, size: medium}

# Набор виджетов ПО УМОЛЧАНИЮ для страницы раздела — общий для всех
# разделов (так решено: разделы одинаковые). Показатели здесь свои,
# разделовские: на главной витрине живут бюджетные, а внутри раздела —
# его собственные план, факт, выдача.
#
# Админ может собрать любому разделу свой набор на странице «Виджеты» —
# тогда для этого раздела список ниже перестаёт действовать.
section_widgets:
  - {chart: total,       indicator: demo_plan,      size: small}
  - {chart: gauge,       indicator: demo_execution, size: small}
  - {chart: total,       indicator: demo_issued,    size: small}
  - {chart: bar,         indicator: demo_plan,      size: large}
  - {chart: months,      indicator: demo_fact,      size: medium}
  - {chart: years_total, indicator: demo_issued,    size: medium}

# Настройки диаграмм
charts:
  # Минимальный размер сектора на круговой, плитках, лучах и сосульках —
  # в процентах от самого крупного сектора. Мелкие регионы подтягиваются
  # до этого размера, иначе подпись в них не помещается.
  #
  # Компромисс: площадь перестаёт быть строго пропорциональна значению.
  # Чтобы это не вводило в заблуждение, числа в подписях и подсказках
  # остаются настоящими, а в заголовке появляется пометка.
  # 0 — не подтягивать, площади строго пропорциональны.
  min_slice_percent: 10

# Карта: файл границ областей и имя поля в нём, по которому искать регион.
# Файла пока нет — вид «Карта» покажет подсказку, что положить.
#
# Лежит в assets/, а не в data/: data/ восстанавливается запуском ETL и потому
# в git не попадает, а границы так не восстановишь — их надо возить с проектом.
# Файл читается с диска, наружу за ним никто не ходит: дашборд во внутренней
# сети без интернета, и карта обязана работать без него.
geo:
  geojson_path: "assets/geo/kaz_admbnda_adm1_2024.json"
  # В файле названия лежат в трёх вариантах: ADM1_EN, ADM1_KK, ADM1_RU.
  # Берём русский — он ближе всего к тому, что в данных.
  feature_key: "properties.ADM1_RU"

  # Из двадцати областей четырнадцать называются одинаково, шесть — по-разному.
  # Здесь только расхождения: как у нас -> как в файле границ.
  # Остальные подставляются как есть.
  region_map:
    Абай: Абайская
    Жетісу: Жетысуская
    Ұлытау: Улытауская
    "г. Алматы": Алматы
    "г. Астана": Астана
    "г. Шымкент": Чимкент      # в файле старое написание, через Ч
