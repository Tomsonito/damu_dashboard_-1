  # ПО-СТАРОМУ — диаграммами Plotly, чтобы сравнить со строками-дивами
  # на соседнем разделе не по описанию, а глазами. Выберут вид — раздел
  # удаляется целиком, вместе со своими строками в `section_tabs_by_section`
  # и `section_widgets_by_page`.
  #
  # `program: СЭЭ` — данные берутся у СЭЭ. Без этого поля раздел искал бы
  # в фактах программу «СЭЭ 2», не нашёл бы и встал бы пустым.
  - {key: see2,          title: "СЭЭ 2",             data: true, abbr: "СЭ2",
