  monitoring:
    - {key: all_all,       title: "Все инструменты", group: "Все инструменты", data: false}
    - {key: all_guarantee, title: "Гарантирование",  group: "Все инструменты", data: false}
    - {key: all_por,       title: "ПОР",             group: "Все инструменты", data: false}
    - {key: all_subsidy,   title: "Субсидирование",  group: "Все инструменты", data: false}
    - {key: all_grants,    title: "Гранты",          group: "Все инструменты", data: false}
    - {key: guar_checked,    title: "Проверенные", group: "Гарантирование", data: false}
       # 4 графика: БВУ · цели займа · ОКЭД · регионы + 2 показателя:
       # сумма гарантий (млрд ₸) · проекты (ед.)
    - {key: guar_violations, title: "Нарушения",   group: "Гарантирование", data: false}
       # 3 графика: БВУ · ОКЭД · регионы + те же 2 показателя
       # (цели займа здесь нет — в документе их три, а не четыре)
    - {key: por_checked,     title: "Проверенные", group: "ПОР", data: false}
       # 4 графика: БВУ · цели займа · ОКЭД · регионы + те же 2 показателя
    - {key: por_violations,  title: "Нарушения",   group: "ПОР", data: false}
       # 4 графика: те же + те же 2 показателя
    - {key: subs_checked,    title: "Проверенные", group: "Субсидирование", data: false}
       # 4 графика: БВУ · цели займа · ОКЭД · регионы + те же 2 показателя
    - {key: subs_violations, title: "Нарушения",   group: "Субсидирование", data: false}
       # 4 графика: те же + те же 2 показателя
    - {key: claims, title: "Выплаченные требования", data: false}
       # 4 графика: БВУ · цели займа · ОКЭД · регионы + 2 показателя:
       # сумма гарантий (млрд ₸) · проекты (ед.)

  # Нефин. поддержка. Раздел в основном ТЕКСТОВЫЙ: отчёты и окошки под них
  # (уточнено пользователем 04.08.2026). Механизма текстовых блоков
  # в проекте пока нет вовсе — вкладки заведены, содержимое ждёт решения
