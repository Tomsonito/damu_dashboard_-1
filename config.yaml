    - {key: dynamics, title: "Динамика", data: false}
       # 4 графика: посетители по возвратам (ед. и %) · по трафику (ед. и %) ·
       # NPS · по неделям за 2026 год (ед.)
    - {key: social,   title: "Соцсети", data: false}
       # 4 графика: возврат и пол (%) · топ городов (%) · топ стран (%) ·
       # взаимодействие (ед.)
    - {key: telegram, title: "Telegram", data: false}
       # топ постов из Telegram + 4 показателя: подписчики (ед.) ·
       # уведомления включены (%) · репосты (ед.) · просмотры постов (ед.)

  # Пробл. активы (деятельность блока ДРПА). 2 секции.
  bad_assets:
    - {key: portfolio,   title: "Движение проблемного портфеля", data: false}
       # 1 окошко для сообщений + 3 диаграммы: за весь период · движение
       # проблемного портфеля · прирост + 3 показателя
       # ?? Какие именно три показателя — в документе не названы
    - {key: receivables, title: "Дебиторская задолженность", data: false}
       # 3 таблицы: возврат субсидий · исполнение планов за квартал
       # в разрезе РФ (млн ₸) · дебиторская задолженность

  # Персонал (департамент по развитию персонала). 3 секции.
  staff:
    - {key: headcount, title: "Штатное расписание", data: false}
       # 2 графика и 6 показателей, по три на каждый график
       # (разбивка уточнена пользователем 04.08.2026):
       #   график «Головной офис»        -> головной офис · РФ · штатная численность
       #   график «Региональные филиалы» -> головной офис · численность
       #                                    аутстаффинга · региональные филиалы
       # !! «Головной офис» встречается в обоих наборах — так в документе
       # и так подтвердил пользователь, это не описка при переносе
    - {key: turnover,  title: "Текучесть персонала", data: false}
       # 6 показателей: добровольная · фактическая · всего уволенных ·
       # по инициативе работника · по соглашению сторон ·
       # по инициативе работодателя
    - {key: training,  title: "Обучение персонала", data: false}
       # 2 графика: подготовка кадров и повышение квалификации ·
       # информация по корпоративному университету

  # СКПД — единственный раздел без секций вовсе: одна таблица.
  skpd:
    - {key: main, title: "СКПД", data: false}
       # 1 таблица

# Какие разделы вынесены вкладками наверх — те, куда ходят чаще всего.
# Остальные никуда не деваются: они в списке «Все разделы», который
# открывается поверх страницы. Ключи — из блока `sections` ниже.
main_tabs: [subsidy, credit, guarantee, nonfin]

# Разделы сайта. Порядок здесь = порядок во всплывающем списке.
#
#   key   — латиницей, попадает в адрес страницы (/section/plan)
#   abbr  — 2–3 буквы для узкой полосы разделов слева: когда список
#           свёрнут, видны только они, и по ним раздел узнают
#   title — как называется в меню
#   data  — есть ли под разделом данные. Раздел без данных показывает
#           заглушку «ждёт источника», а в меню выглядит приглушённым:
#           лучше честно сказать, что пусто, чем дать человеку тыкаться
#
# Значение `title` должно совпадать с колонкой «программа» в данных —
# по нему страница и отбирает свои строки.
sections:
