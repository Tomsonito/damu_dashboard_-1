# Реестр показателей: как называть, в чём измерять, как показывать.
# Добавить показатель = добавить блок сюда. Код страниц не меняется.
#
#   title        — полное название, для подписей осей и подсказок
#   short        — короткое, для карточек
#   unit         — единица измерения в исходных данных
#   kind         — stock: срез на дату | flow_ytd: накоплено с начала года
#   divisor      — на сколько делить перед показом
#   display_unit — что писать после числа
#   decimals     — знаков после запятой

indicators:
  registered_smb:
    title: "Зарегистрированные субъекты МСП"
    short: "Зарегистрировано"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0

  active_smb:
    title: "Действующие субъекты МСП"
    short: "Действующих"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0

  employed:
    title: "Численность занятых в МСП"
    short: "Занятых"
    unit: "человек"
    kind: stock
    divisor: 1
    display_unit: "чел."
    decimals: 0

  output:
    title: "Выпуск продукции субъектами МСП"
    short: "Выпуск продукции"
    unit: "млн тенге"
    kind: flow_ytd
    divisor: 1000000
    display_unit: "трлн ₸"
    decimals: 2

# Порядок карточек на главном экране
kpi_order: [registered_smb, active_smb, employed, output]

# Группировка областей в макрорегионы — для диаграмм «структура»
# (солнечные лучи, каскад). Деление условное, поправьте под принятое у вас.
macroregions:
  Север: [Акмолинская, Костанайская, Павлодарская, Северо-Казахстанская, "г. Астана"]
  Юг: [Жамбылская, Кызылординская, Туркестанская, "г. Шымкент"]
  Юго-восток: [Алматинская, Жетісу, "г. Алматы"]
  Запад: [Актюбинская, Атырауская, Западно-Казахстанская, Мангистауская]
  Восток: [Восточно-Казахстанская, Абай]
  Центр: [Карагандинская, Ұлытау]

# Настройки диаграмм
charts:
  # Минимальный размер сектора на круговой, плитках, лучах и сосульках —
  # в процентах от самого крупного сектора. Мелкие регионы подтягиваются
  # до этого размера, иначе подпись в них не помещается.
  #
  # Компромисс: площадь перестаёт быть строго пропорциональна значению.
  # Чтобы это не вводило в заблуждение, числа в подписях и подсказках
  # остаются настоящими, а в заголовке появляется пометка.
  # 0 — не подтягивать, площади строго пропорциональны.
  min_slice_percent: 10

# Карта: файл границ областей и имя поля в нём, по которому искать регион.
# Файла пока нет — вид «Карта» покажет подсказку, что положить.
geo:
  geojson_path: "data/kz_regions.geojson"
  feature_key: "properties.name"
