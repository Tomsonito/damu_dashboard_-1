  subsidy_project_amount:
    title: "Объём просубсидированных кредитов"
    short: "Субсидируемые кредиты"
    unit: "тенге"
    kind: flow
    divisor: 1000000000
    display_unit: "млрд ₸"
    decimals: 2
    agg: sum

  workplaces_created:
    title: "Создано рабочих мест"
    short: "Рабочих мест"
    unit: "мест"
    kind: flow
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: sum

  budget_sme_registered:
    title: "Зарегистрировано МСП (данные БД)"
    short: "Зарег. (БД)"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: last

  budget_sme_active:
    title: "Действующих МСП (данные БД)"
    short: "Действ. (БД)"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
