  - {key: orleu,         title: "Өрлеу",             data: true, abbr: "ӨР"}
  - {key: subsidy,       title: "Суб. выдача",       data: true, abbr: "СВ"}
  - {key: subsidy_debt,  title: "Суб. — Осн. долг",  data: true, abbr: "СОД"}
