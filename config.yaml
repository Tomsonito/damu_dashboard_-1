  nonfin:
    - {key: centers,  title: "ЕКЦ/ЕФО/МФО", data: false}
       # 4 таблицы: ЕКЦ · распределение входящих звонков по ДО · единый
       # фронт-офис холдинга «Baiterek» · обратная связь клиентов
       # по качеству консультирования через QR-код + 1 окошко для текста
    - {key: training, title: "Обучение", data: false}
       # 1 график: дистанционное обучение «Современный предприниматель»
       # + 2 окошка для текста
    - {key: partners, title: "Маркетплейс/Консалтинг", data: false}
       # 2 диаграммы: маркетплейс (Halyk market, Forte market) ·
       # консалтинговые компании
       # ?? Название секции в документе не задано — придумано по содержимому
    - {key: extra,    title: "Дополнительно", data: false}
       # 2 окошка для текста
       # ?? Ни названия секции, ни состава текста в документе нет

  # Маркетинг (блок маркетинга — веб-сайт). 4 секции.
  marketing:
    - {key: visitors, title: "Посетители", data: false}
       # 1 карта + 3 графика: посетители по городам (ед.) · по программам (ед.) ·
       # по полу (ед.) + 1 показатель: общее число посетителей с 2025 года (ед.)
