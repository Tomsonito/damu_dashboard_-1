  # @@ ПЕРВАЯ СЕКЦИЯ ПОКА ПУСТАЯ, и это осознанно (решено 04.08.2026).
  # Пользователь: «там всё на одной странице и 50 разных показателей
  # к разным подсекциям» — состав распишем позже. Вкладки заведены
