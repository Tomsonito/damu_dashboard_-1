  # --- ДЕМОНСТРАЦИОННЫЕ показатели (макет разделов) -------------------
  # !! Числа выдуманы генератором `python -m etl.make_samples`, к настоящим
  # показателям Фонда отношения не имеют. Живут в отдельной таблице
  # `demo_facts` и подмешиваются только при `demo_data: true` ниже.
  # Коды нарочно свои (demo_*): сложиться с настоящими в одну сумму
  # они не могут. Когда придут реальные данные по разделам — эти пять
  # блоков удаляются, и всё, что на них построено, исчезает вместе с ними.
  demo_plan:
    title: "План"
    short: "План"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  demo_fact:
    title: "Факт"
    short: "Факт"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  demo_issued:
    title: "Выдано"
    short: "Выдано"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  demo_contracts:
    title: "Договоров"
    short: "Договоров"
    unit: "штук"
    kind: flow
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: sum

  demo_jobs:
    title: "Рабочих мест"
    short: "Рабочих мест"
    unit: "мест"
    kind: flow
    divisor: 1
    display_unit: ""
    decimals: 0
    agg: sum

  # Остаток = план минус факт. Второй вид производного показателя:
  # не доля, а разность. В данных его нет, считается на лету.
  demo_rest:
    title: "Остаток"
    short: "Остаток"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    difference: [demo_plan, demo_fact]

  # Производная к демо-показателям: та же механика, что у «Согласно плану»
  demo_execution:
    title: "Освоение — факт от плана"
    short: "Освоение"
    unit: "%"
    kind: ratio
    divisor: 1
    display_unit: "%"
    decimals: 1
    derived:
      numerator: demo_fact
      denominator: demo_plan

# Порядок карточек на главном экране.
# Показатели, которых нет в загруженных данных, пропускаются молча —
# так реестр может описывать больше источников, чем подключено сейчас.
kpi_order: [budget_allocated, budget_spent, budget_execution, subsidies_issued, workplaces_created]

# Группировка областей в макрорегионы — для диаграмм «структура»
# (солнечные лучи, каскад). Деление условное, поправьте под принятое у вас.
macroregions:
  Север: [Акмолинская, Костанайская, Павлодарская, Северо-Казахстанская, "г. Астана"]
  Юг: [Жамбылская, Кызылординская, Туркестанская, "г. Шымкент"]
  Юго-восток: [Алматинская, Жетісу, "г. Алматы"]
  Запад: [Актюбинская, Атырауская, Западно-Казахстанская, Мангистауская]
  Восток: [Восточно-Казахстанская, Абай]
  Центр: [Карагандинская, Ұлытау]

# !! ДЕМОНСТРАЦИОННЫЕ ДАННЫЕ — переключатель макета.
#
# true  — к настоящим фактам подмешиваются выдуманные строки из таблицы
#         `demo_facts`, чтобы разделы меню не стояли пустыми;
# false — сайт показывает только реальные данные, демо-таблица остаётся
#         лежать нетронутой.
#
# Одна строка выключает весь макет. Перед показом с настоящей базой —
# поставить false (или удалить таблицу: DROP TABLE demo_facts).
# Откуда берутся числа: python -m etl.make_samples
demo_data: true

# Вкладки-разрезы внутри раздела — ряд вкладок на странице раздела.
# Взяты с боевого портала: там раздел смотрят под этими углами.
#
#   key   — попадает в ключ набора виджетов (раздел:вкладка)
#   title — надпись на вкладке
#   data  — есть ли под этот разрез данные. Нет — на месте диаграмм
#           появляются полосатые заглушки, а не пустые рамки.
#   group — необязательная группа. Вкладки с одинаковым `group`
#           сворачиваются в ОДНУ вкладку верхнего уровня с этим названием,
#           а при выборе раскрываются отдельным рядом «пилюль» под ней
#           (вариант 5b из макета). Нужно, когда разрезов много и в один
#           ряд они не читаются.
#   kpi   — необязательный список карточек-показателей для ЭТОЙ вкладки
#           (ключи из `indicators` выше). Показывается один раз, в начале
#           блока этой вкладки — раньше был один общий ряд `section_kpi`
#           над всей лентой, 04.08.2026 разнесён по вкладкам, каждой своё.
#           Ставить только там, где показатели ДЕЙСТВИТЕЛЬНО подходят
#           вкладке по смыслу: у большинства новых вкладок ниже своих
#           показателей в данных ещё нет вовсе, и поле просто не указано —
#           это не забытая правка, а честное отсутствие числа.
#
# Вкладка НЕ переключает содержимое: страница раздела — одна длинная лента,
# вкладка прокручивает её к своей секции, а при прокрутке мышью сама
# подсвечивается нужная. Так сделано в макете, так же на боевом портале.
#
# !! Сейчас данные есть только под два разреза: годы и регионы. Программы,
# ОКЭД, БВУ и бюджет ждут источника — колонки под них в таблице фактов
# заведены (`program`, `instrument`), но пусты.
section_tabs:
  - {key: years,    title: "Динамика по годам",      data: true,
     kpi: [demo_plan, demo_fact, demo_rest, demo_execution]}
  - {key: programs, title: "Программы/Цели займа",   data: false}
  - {key: regions,  title: "ОКЭД/Регионы",           data: true}
  - {key: banks,    title: "БВУ/Субъектность",       data: false}
  - {key: budget,   title: "Бюджет",                 data: false}

# Свой набор вкладок для отдельного раздела. Ключ — ключ раздела из
# `sections`. Чего здесь нет — берёт общий `section_tabs` выше.
#
# Восемь разделов ниже расписаны по «Описание разделов.md» (получен
# 04.08.2026, автор — пользователь, часть разделов описана, остальные
# ждут своей очереди и пока живут на общем списке section_tabs). Разрезов
# там названо намного больше двух — программы, цели займа, ОКЭД, БВУ,
# субъектность, финансовые институты, — но ни один из них в боевой базе
# не завёлся: `data: false` везде, где документ описывает разрез, которого
# в фактах нет. Это **чертёж наперёд** (решено с пользователем 04.08.2026),
# а не недоделка: когда источник начнёт присылать эти разрезы, включить
# их — правка `data: false` → `true` в нужной строке, а не пересборка
# структуры. Число диаграмм и показателей из документа записано в
# комментарии к каждой вкладке — сверяться с ним, когда данные придут.
section_tabs_by_section:
  # СЭЭ — социально-экономический эффект. Три вкладки, у каждой одни и те
  # же 4 диаграммы (выпуск продукции, созданные и сохранённые рабочие
  # места, налоговые поступления), только разрез снаружи разный.
  see:
    # «Динамика по годам» — не одна вкладка с четырьмя графиками, а ГРУППА
    # из четырёх подсекций, по одной на показатель (08.08.2026, просьба
    # пользователя). Механизм тот же, что у «ГФ1» в Гар. выдаче: в шапке
    # одна кнопка «Динамика по годам», она раскрывает ряд «пилюль», каждая
    # прокручивает к своей секции ленты.
    #
    # У каждой подсекции свой график во всю ширину (`size: large`
    # в section_widgets_by_page) и своя карточка-показатель того же
    # показателя: число и его динамика стоят рядом, а не в общем ряду
    # из четырёх карточек над всей вкладкой, как было.
    #
    # `hero` (17.08.2026, макет «Разделы — редизайн») — вид карточки слева
    # от графика. Она ЗАМЕНЯЕТ ряд `kpi` у этой вкладки: показатель тот же
    # (берётся из `kpi[0]`, чтобы не писать его в конфиге дважды), но кроме
    # числа карточка показывает и движение — а именно за ним сюда и идут.
    #   trend   — число, спарклайн последних лет, дельта к прошлому году;
    #   compare — только два года столбиком, без спарклайна.
    # Пусто или ключа нет — рисуется прежний ряд карточек `kpi`.
    #
    # `compare` стоит у «Созданных раб. мест» не для разнообразия: у этого
    # показателя первые два года ряда рвут его в клочья — 30 246 в 2019-м
    # против 3 911 в 2020-м, почти восьмикратный обвал (замерено 17.08.2026
    # по хранилищу). Спарклайн на таком размахе превращается в отвесную
    # стену, за которой все годы с 2021-го лежат почти в одну линию,
    # хотя между ними полуторакратная разница.
    #
    # !! 18.08.2026 (по просьбе пользователя) здесь тоже `trend`, а не
    # `compare`, как было раньше специально для этой карточки. Решение
    # то же, что уже подобрали для СЭЭ 2 с тем же показателем: график
    # остаётся, но окно спарклайна обрезано до `hero_spark_years: 4` —
    # линия по 2021–2024, где разброс честный, а не по всем шести годам,
    # где обвал 2020-го тянет их в кучу у пола (замер СЭЭ 2, 18.08.2026:
    # на полных шести 2021–2024 занимали всего 32–67 % высоты).
    - {key: years_output,  title: "Выпуск продукции",  group: "Динамика по годам",
       data: true, kpi: [see_output],       hero: trend}
    - {key: years_jobs,    title: "Созданные раб. места", group: "Динамика по годам",
       data: true, kpi: [see_jobs_created], hero: trend, hero_spark_years: 4}
    - {key: years_tax,     title: "Налоговые поступления", group: "Динамика по годам",
       data: true, kpi: [see_tax_revenue],  hero: trend}
    - {key: years_saved,   title: "Сохранённые раб. места", group: "Динамика по годам",
       data: true, kpi: [see_jobs_saved],   hero: trend}
    # !! «Отрасли» и «Регионы» — по ОДНОЙ вкладке с четырьмя диаграммами
    # 2×2, а НЕ группа подсекций (решено 11.08.2026, после сравнения
    # с оригинальным порталом tablo.fund.kz).
    #
    # Раскладку диктует разрез, а не единообразие. «Динамика по годам»
    # выше разбита на подсекции потому, что это четыре временных ряда:
    # их смотрят по одному, и каждому нужна ширина. Здесь наоборот —
    # вопрос сравнительный: «Алматы первый по выпуску, а по рабочим
    # местам тоже?». Четыре диаграммы рядом на него отвечают, подсекции
    # такой вопрос убивают: пришлось бы прокручивать и держать в голове.
    #
    # Так же сделано и в оригинальном портале, с которого срисован
    # дашборд, — там люди работают каждый день.
    - {key: industries, title: "Отрасли",              data: true}
       # те же 4 диаграммы, разрез по отраслям
    - {key: regions,    title: "Регионы",              data: true}
       # те же 4 диаграммы, разрез по регионам

  # СЭЭ 2 повторяет утверждённый макет целиком: сначала четыре временных
  # ряда в группе «Динамика по годам», затем компактные разрезы.
  see2:
    - {key: years_output, title: "Выпуск продукции", group: "Динамика по годам (4)",
       data: true, kpi: [see_output], hero: trend}
    # !! `hero: trend` с обрезанным окном, а не `compare` — то же решение,
    # что чуть позже в тот же день переняла и «СЭЭ» выше (18.08.2026).
    # У показателя восьмикратный обвал 2019→2020 (30 246 → 3 911), из-за
    # которого полный спарклайн на шести годах сплющивал 2021–2024 почти
    # в линию. `hero_spark_years: 4` рисует только 2021–2024, где разброс
    # честный и читаемый. Замерено 18.08.2026: линейная шкала на полных
    # шести даёт 2021–2024 всего 32–67 % высоты (сплющено), логарифмическая
    # — ещё туже, 57–83 %. Обрезка окна — единственный вариант, который
    # ничего не подделывает: обвал остаётся видимым в двух числах сверху
    # (см. «Созданные раб. места» на карточке), а не изображается
    # диаграммой, зато сама диаграмма не врёт своей формой.
    - {key: years_jobs, title: "Созданные раб. места", group: "Динамика по годам (4)",
       data: true, kpi: [see_jobs_created], hero: trend, hero_spark_years: 4}
    - {key: years_tax, title: "Налоговые поступления", group: "Динамика по годам (4)",
       data: true, kpi: [see_tax_revenue], hero: trend}
    - {key: years_saved, title: "Сохранённые раб. места", group: "Динамика по годам (4)",
       data: true, kpi: [see_jobs_saved], hero: trend}
    # Четыре разреза собраны в единую 2×2 панель из утверждённого макета.
    - {key: industries, title: "Отрасли", data: true}
    - {key: regions, title: "Регионы", data: true}

  # Гар. выдача — единственный раздел, уже собранный раньше (структура
  # подтвердилась документом почти дословно). Ниже — та же структура,
  # только с числом диаграмм и показателей из документа в комментариях.
  guarantee:
    - {key: years,       title: "Динамика по годам",     data: true,
       kpi: [guarantees_issued]}
       # 1 диаграмма (динамика по годам) + 4 показателя: проекты (ед.) ·
       # уникальные заёмщики (ед.) · сумма кредитов (млрд ₸) · сумма
       # гарантий (млрд ₸)
    - {key: programs,    title: "Программа/цели займа",  data: true}
       # 2 диаграммы (программы · цели займа) + те же 4 показателя
    - {key: plan,        title: "План/освоение",         data: false, abbr: "ПО"}
       # 4 диаграммы: программы (млрд ₸) · финансовые институты (млрд ₸,
       # делится на ГФ1 / ГФ2 / АПК) + 4 показателя: план · освоено ·
       # остаток · % исполнения (млрд ₸ / %)
    - {key: regions,     title: "ОКЭД/Регионы",          data: true}
       # 2 диаграммы (виды деятельности · регионы) + те же 4 показателя
    - {key: banks,       title: "БВУ/субъектность",      data: true}
       # 2 диаграммы (финансовые институты · субъектность) + те же 4 показателя
    - {key: gf1_limits,  title: "Лимиты",        group: "ГФ1", data: false}
       # 1 таблица: распределение лимитов на БВУ по ГФ1 (млн ₸) + 4 показателя:
       # общий план · лимит фонда · лимит БВУ · взносы (млн ₸)
    - {key: gf1_spent,   title: "Освоение",      group: "ГФ1", data: false}
       # 1 таблица: освоение по ГФ1 (млн ₸) + 4 показателя: общий лимит ·
       # освоено · остаток · % освоения
    - {key: gf1_pipe,    title: "Пайп",          group: "ГФ1", data: false}
       # 1 таблица: еженедельный пайплайн (млн ₸)
    - {key: gf1_capital, title: "Капитализация", group: "ГФ1", data: false}
       # 2 диаграммы: капитализация ГФ1 (млрд ₸) · взносы кредиторов (млн ₸)
       # + 1 показатель: сумма оплаченного требования (млрд ₸)

  # ГФ2 — отдельный раздел (свой ключ в `sections`), не подвкладка внутри
  # «Гар. выдача»: так же устроено и в документе. У него нет ни «Годов»,
  # ни «Регионов» — весь раздел про статус проектов, разреза по областям
  # документ не называет вовсе.
  gf2:
    - {key: pipeline,  title: "Pipeline",                    data: false}
       # 3 таблицы: одобренные проекты · на рассмотрении в Фонде ·
       # подписанные проекты (млн ₸) + 3 показателя: план · факт · % исполнения
    - {key: creditors, title: "На рассмотрении у кредиторов", data: false}
       # 1 таблица: на рассмотрении у кредиторов (млн ₸)
    - {key: capital,   title: "Капитализация",                data: false}
       # 1 диаграмма: капитализация ГФ2

  # Гар. — Осн. долг. Двумя вкладками, тоже без «Годов»: документ начинает
  # прямо с программ.
  guarantee_debt:
    - {key: programs, title: "Программы/БВУ/Цели займа", data: false}
       # 3 диаграммы: программы · финансовые институты · цели займа +
       # 4 показателя: проекты · уникалы · сумма ОД · сумма ост. гарантий (млрд ₸)
    - {key: regions,  title: "ОКЭД/Регионы",             data: true}
       # 2 диаграммы: виды деятельности (ОКЭД) · регионы + те же 4 показателя

  # Кредит. выдача (льготное кредитование). В программах/ОКЭД/БВУ документ
  # прямо называет одну диаграмму заглушкой — оставлена как есть, третьей
  # диаграммы в источнике нет и по документу.
  credit:
    - {key: years,    title: "Динамика по годам",    data: true,
       kpi: [credits_issued]}
       # 1 диаграмма (динамика по годам) + 2 показателя: уникальные
       # заёмщики (ед.) · сумма кредитов итого (млрд ₸)
    - {key: programs, title: "Программы/Цели займа", data: true}
       # 3 диаграммы: программы · цели займа · (третья не описана) +
       # 3 показателя: уникалы · сумма кредитов итого · сумма кредитов Өрлеу
    - {key: regions,  title: "ОКЭД/Регионы",         data: true}
       # 3 диаграммы: регионы · виды деятельности · (третья не описана) +
       # те же 3 показателя
    - {key: banks,    title: "БВУ/Субъектность",     data: true}
       # 3 диаграммы: финансовые институты · субъектность ·
       # (третья не описана) + те же 3 показателя

  # Өрлеу — своя программа внутри «Кредит. выдача» (сумма кредитов Өрлеу
  # там же, отдельным показателем), но и самостоятельный раздел с тремя
  # вкладками — тот же приём, что у ГФ1/ГФ2.
  orleu:
    - {key: status,  title: "Текущий статус",             data: true, kpi: [credits_issued]}
       # 2 диаграммы: размещение · выдано + 2 показателя: уникалы (ед.) ·
       # сумма кредитов итого (млрд ₸)
    - {key: terms,   title: "Цели займа/БВУ/Субъектность", data: true, kpi: [credits_issued]}
       # 4 диаграммы: программы · цели займа · субъектность ·
       # финансовые институты + те же 2 показателя
    - {key: regions, title: "ОКЭД/Регионы",               data: true, kpi: [credits_issued]}
       # 2 диаграммы: ОКЭД · регионы + те же 2 показателя

  # Суб. выдача (субсидирование) — семь вкладок, «Іскер Аймақ» в группе
  # (тот же приём, что ГФ1 у «Гар. выдача»).
  subsidy:
    - {key: years,    title: "Динамика по годам",    data: true,
       kpi: [subsidy_project_amount]}
       # план по этому разделу пока не приехал (нет источника) — KPI
       # только по факту, как у «Кредит. выдачи»
    - {key: programs, title: "Программы/Цели займа", data: true}
       # 2 диаграммы (программы · цели займа)
    - {key: regions,  title: "ОКЭД/Регионы",         data: true}
       # 2 диаграммы (виды деятельности · регионы)
    - {key: banks,    title: "БВУ/Субъектность",     data: true}
       # 2 диаграммы (финансовые институты · субъектность)
       # Банков всего 55, но график всегда за ОДИН год (см. resolve_year) —
       # максимум одновременно 32 (2025-й), сопоставимо с «Гар. выдачей»
       # (28), для которой уже подобран size: large. Как это выглядит
       # глазами — не проверено (сайт не запускался, правило 3)
    - {key: budget,   title: "Бюджет",                data: false}
       # 3 диаграммы: ППРК · Іскер Аймақ · МТИ
    - {key: plan,     title: "План освоения",         data: false, abbr: "ПО"}
       # 2 диаграммы: программы (млрд ₸) · финансовые институты (млрд ₸) +
       # 4 показателя: план · освоено · остаток · % освоения
    - {key: iskeraimak_limits, title: "Лимиты", group: "Іскер Аймақ", data: false}
       # 1 диаграмма: распределение лимитов на БВУ по Іскер Аймақ (млн ₸) +
       # 4 показателя: лимиты · освоено · остаток лимита · % освоения
    - {key: iskeraimak_pipe,   title: "Пайп",   group: "Іскер Аймақ", data: false}
       # 2 диаграммы: пайплайн в разрезе банков · пайплайн в разрезе регионов (млн ₸)

  # Суб. — Осн. долг. Тоже без «Годов»: документ начинает с программ.
  subsidy_debt:
    - {key: programs, title: "Программы/Цели займа", data: false}
       # 2 диаграммы: программы · цели займа + 3 показателя: проекты ·
       # уникалы · сумма ОД (млрд ₸)
    - {key: regions,  title: "ОКЭД/Финансовые институты/Регионы", data: true}
       # 3 диаграммы: виды деятельности (ОКЭД) · финансовые институты ·
       # регионы + те же 3 показателя

  # ─── Ниже — вторая половина документа, перенесена 04.08.2026 ───
  # Одиннадцать разделов, которых в первой версии файла ещё не было.
  # Правило то же: всё `data: false`, потому что ни одного из этих
  # разрезов в боевой базе нет; в комментариях — состав из документа,
  # чтобы собрать виджеты, когда придёт источник.

  # Суб. — Выплаты (выплаченные субсидии). Две секции.
  subsidy_pay:
    - {key: programs, title: "Программы/Цель кредитования", data: false}
       # 4 графика: выплаченные субсидии по программе · по цели кредитования ·
       # принятые обязательства по программам · выплаченные субсидии
       # и принятые обязательства по годам (млн ₸) + 2 показателя:
       # выплаченные субсидии (млн ₸) · принятые обязательства (млн ₸)
    - {key: regions,  title: "БВУ/ОКЭД/Регионы", data: true}
       # 3 графика: финансовые институты · виды деятельности · регионы +
       # 1 показатель: выплаченные субсидии (млн ₸)

  # Фин. показатели. Обе секции — таблица плюс ряд показателей.
  finance:
    - {key: main,     title: "Финансовые показатели", data: false}
       # 1 таблица: основные консолидированные показатели (январь–июнь) +
       # 4 показателя: активы · обязательства · капитал · чистая прибыль
    - {key: expenses, title: "КПД/Освоение средств/Адм. расходы", data: false}
       # 1 таблица: консолидированные административные расходы, прогноз
       # с обоснованием роста или снижения + 6 показателей: кредитный
       # портфель (нетто) · освоение средств: гарантирование · доля
       # кредитного портфеля от общих активов (нетто) · освоение средств:
       # бюджетное кредитование · ROA · освоение средств: субсидирование

  # Казначейство — самый большой раздел: 6 секций, четыре из них с
  # подсекциями. Почти всё таблицами; диаграммы только в «Портфеле ЦБ».
  #
  # !! Тройка «ВСДС / ГФ1 / ГФ2» повторяется в трёх разных секциях
  # («Информация», «Доходность», «Trades»). Названия вкладок при этом
  # одинаковые — различают их ключи (`info_*`, `yield_*`, `trades_*`)
  # и группа. Так и надо: человек видит «ВСДС» внутри своей группы,
  # а ключ нужен коду, чтобы не перепутать наборы виджетов.
  treasury:
    - {key: info_vsds,   title: "ВСДС", group: "Информация", data: false}   # 1 таблица
    - {key: info_gf1,    title: "ГФ1",  group: "Информация", data: false}   # 1 таблица
    - {key: info_gf2,    title: "ГФ2",  group: "Информация", data: false}   # 1 таблица
    - {key: yield_vsds,  title: "ВСДС", group: "Доходность", data: false}
       # 3 таблицы: за прошлый год · на нынешний квартал · на данный месяц
    - {key: yield_gf1,   title: "ГФ1",  group: "Доходность", data: false}   # те же 3 таблицы
    - {key: yield_gf2,   title: "ГФ2",  group: "Доходность", data: false}   # те же 3 таблицы
    - {key: yield_years, title: "Доходы и доходность ВСДС по годам", data: false}
       # 3 таблицы: динамика среднегодовых объёмов ВСД по инструментам (млн ₸) ·
       # динамика дохода по ВСДС (млн ₸) · динамика доходности портфеля ВСД (%)
    - {key: accounts,    title: "Текущие счета, депозиты и ЦБ", data: false}
       # 3 таблицы: текущие счета · депозиты · портфель ценных бумаг
    - {key: trades_vsds, title: "ВСДС", group: "Trades", data: false}       # 1 таблица
    - {key: trades_gf1,  title: "ГФ1",  group: "Trades", data: false}       # 1 таблица
    - {key: trades_gf2,  title: "ГФ2",  group: "Trades", data: false}       # 1 таблица
    - {key: sec_yield,   title: "Доходность", group: "Портфель ЦБ", data: false}
       # 2 графика: доходность портфеля ЦБ в тенге и в валюте, по эмитентам
    - {key: sec_structure, title: "Структура", group: "Портфель ЦБ", data: false}
       # 1 график: структура портфеля ценных бумаг по месяцам
    - {key: sec_market,  title: "Рыночная стоимость", group: "Портфель ЦБ", data: false}
       # 1 график: рыночная стоимость ценных бумаг портфеля ВСДС
    - {key: sec_terms,   title: "Структура по сроку размещения", group: "Портфель ЦБ", data: false}
       # 2 диаграммы: дней до погашения по эмитентам · структура ВСДС по срокам

  # Закупки. Две секции, у каждой одна таблица со своим же названием.
  # ?? Показатели в документе названы один раз на обе секции — поставил
  # их обеим: по смыслу «план закупа / исполнение» относится к каждой.
  procurement:
    - {key: sp_rf,  title: "Закупки по СП и РФ", data: false}
       # 1 таблица (одноимённая) + 3 показателя: планируемая сумма закупа
       # (млн ₸) · исполнение плана закупок (млн ₸) · исполнение плана (%)
    - {key: method, title: "Закупки по способу закупа", data: false}
       # 1 таблица (одноимённая) + те же 3 показателя

  # Риск-менеджмент. 5 секций, две из них с подсекциями.
  risk:
    - {key: bvu_overview, title: "Обзор рынка БВУ", group: "Анализ рынка БВУ", data: false}
       # 4 диаграммы: активы БВУ (млрд ₸) · ссудный портфель БВУ (млрд ₸) ·
       # NPL90+ по БВУ · K4 по БВУ
    - {key: bvu_finance,  title: "Финансовые показатели БВУ", group: "Анализ рынка БВУ", data: false}
       # 1 таблица: финансовые показатели БВУ (тыс. ₸)
    - {key: bvu_quality,  title: "Качество кредитного портфеля", group: "Анализ рынка БВУ", data: false}
       # 1 таблица: качество кредитного портфеля БВУ-партнёров (тренды за месяц)
    - {key: bvu_npl,      title: "Доля NPL90+", group: "Анализ рынка БВУ", data: false}
       # 4 диаграммы: NPL90+ по рынку БВУ · по рынку бизнес · по КБ · по МСБ
    - {key: appetite,     title: "Риск-аппетит", data: false}
       # 1 таблица: отчёт по соблюдению риск-аппетита фонда
    - {key: dor_limits,   title: "Соблюдение лимитов", group: "ДОР", data: false}
       # 3 графика: структура освоения лимита · разбивка по рейтингам (млрд ₸) ·
       # структура лимитов БВУ на дату (млрд ₸)
    - {key: dor_institutions, title: "Средства по фин. институтам", group: "ДОР", data: false}
       # 4 диаграммы под одним названием: структура размещения средств
       # по финансовым институтам
    - {key: dor_programs, title: "Средства по программам", group: "ДОР", data: false}
       # 2 вида диаграммы на одних данных
       # ?? В документе подпись та же, что у предыдущей подсекции
       # («структура размещения средств по финансовым институтам») —
       # похоже на описку, по названию секции здесь должны быть программы
    - {key: dor_covenants, title: "БВУ ковенанты", group: "ДОР", data: false}
       # 1 таблица: соблюдение БВУ ковенантов в рамках кредитного соглашения
    - {key: dor_flows,    title: "Оттоки/притоки", group: "ДОР", data: false}
       # 1 график: динамика оттоков/притоков по банкам за последний месяц
    - {key: guarantee_portfolio, title: "Гарантийный портфель", data: false}
       # @@ в документе помечено «в разработке» — состав ещё не определён
    - {key: provisions,   title: "Объём провизий", data: false}
       # 3 графика: объём сформированных провизий (млрд ₸) · прогнозы
       # по портфелю гарантирования 2026–2028 (млрд ₸) · прогнозы
