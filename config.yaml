# Реестр показателей: как называть, в чём измерять, как показывать.
# Добавить показатель = добавить блок сюда. Код страниц не меняется.
#
#   title        — полное название, для подписей осей и подсказок
#   short        — короткое, для карточек
#   unit         — единица измерения в исходных данных
#   kind         — stock: срез на дату | flow_ytd: накоплено с начала года
#   divisor      — на сколько делить перед показом
#   display_unit — что писать после числа
#   decimals     — знаков после запятой
#   agg          — как сворачивать несколько строк в одну (помесячные данные
#                  за год): sum — сложить, last — взять на последнюю дату,
#                  mean — среднее. По умолчанию sum.

indicators:
  registered_smb:
    title: "Зарегистрированные субъекты МСП"
    short: "Зарегистрировано"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0

  active_smb:
    title: "Действующие субъекты МСП"
    short: "Действующих"
    unit: "единиц"
    kind: stock
    divisor: 1
    display_unit: ""
    decimals: 0

  employed:
    title: "Численность занятых в МСП"
    short: "Занятых"
    unit: "человек"
    kind: stock
    divisor: 1
    display_unit: "чел."
    decimals: 0

  output:
    title: "Выпуск продукции субъектами МСП"
    short: "Выпуск продукции"
    unit: "млн тенге"
    kind: flow_ytd
    divisor: 1000000
    display_unit: "трлн ₸"
    decimals: 2
    agg: last

  # --- Из БД test_ai, помесячные таблицы budget_regions_ММ.ГГ ---
  # Внимание: budget_sme_* меряют то же, что registered_smb/active_smb выше,
  # но другим методом и за другой период — цифры не сходятся. Это разные
  # показатели, сливать их в один нельзя.



  see_output_industry:
    title: "Выпуск продукции (в сумме, млрд тенге)"
    short: "Выпуск продукции"
    unit: "млрд тенге"
    kind: flow_ytd
    divisor: 1
    display_unit: "млрд ₸"
    decimals: 0
    agg: sum
    tone: 1

  see_jobs_created_industry:
    title: "Количество созданных рабочих мест (ед.)"
    short: "Создано раб. мест"
    unit: "ед."
    kind: flow_ytd
    divisor: 1
    display_unit: "ед."
    decimals: 0
    agg: sum
    tone: 2

  see_jobs_saved_industry:
    title: "Количество сохраненных рабочих мест (ед.)"
    short: "Сохранено раб. мест"
    unit: "ед."
    kind: flow_ytd
    divisor: 1
    display_unit: "ед."
    decimals: 0
    agg: sum
    tone: 2

  see_tax_revenue_industry:
    title: "Налоговые поступления (в сумме, млрд тенге)"
    short: "Налоговые поступления"
    unit: "млрд тенге"
    kind: flow_ytd
    divisor: 1
    display_unit: "млрд ₸"
    decimals: 0
    agg: sum
    tone: 3

  see_output:
    title: "Выпуск продукции (в сумме, млрд тенге)"
    short: "Выпуск продукции"
    unit: "млрд тенге"
    kind: flow_ytd
    divisor: 1
    display_unit: "млрд ₸"
    decimals: 0
    agg: sum
    tone: 1

  see_jobs_created:
    title: "Количество созданных рабочих мест (ед.)"
    short: "Создано раб. мест"
    unit: "ед."
    kind: flow_ytd
    divisor: 1
    display_unit: "ед."
    decimals: 0
    agg: sum
    tone: 2

  see_jobs_saved:
    title: "Количество сохраненных рабочих мест (ед.)"
    short: "Сохранено раб. мест"
    unit: "ед."
    kind: flow_ytd
    divisor: 1
    display_unit: "ед."
    decimals: 0
    agg: sum
    tone: 2

  see_tax_revenue:
    title: "Налоговые поступления (в сумме, млрд тенге)"
    short: "Налоговые поступления"
    unit: "млрд тенге"
    kind: flow_ytd
    divisor: 1
    display_unit: "млрд ₸"
    decimals: 0
    agg: sum
    tone: 3

  budget_allocated:
    title: "Выделено бюджета"
    short: "План (выделено)"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  budget_spent:
    title: "Освоено бюджета"
    short: "Факт (освоено)"
    unit: "млн тенге"
    kind: flow
    divisor: 1000
    display_unit: "млрд ₸"
    decimals: 1
    agg: sum

  # Производный показатель: в данных его нет, считается из двух других.
  # В исходных таблицах была готовая колонка execution_percent — её не берём
  # осознанно: производное надо считать из частей, иначе однажды разойдётся.
  #
  # Пока процент считается «от плана за прошедшие месяцы»: и план, и факт
  # берутся за загруженные месяцы года. Если заказчик решит «от годового
  # плана» — правка здесь не поможет, надо будет менять расчёт в get_kpi.
  budget_execution:
    title: "Освоение бюджета — факт от плана"
    short: "Согласно плану"
    unit: "%"
    kind: ratio
    divisor: 1
    display_unit: "%"
    decimals: 1
    derived:
      numerator: budget_spent        # факт — освоено
      denominator: budget_allocated  # план — выделено

  subsidies_issued:
