# Nginx перед приложением: единственная точка входа, внутренний HTTPS,
# ограничение частоты запросов. Gunicorn слушает только 127.0.0.1:8050 —
# снаружи в него не попасть иначе как через этот Nginx.
#
# Файл — ШАБЛОН: подставьте <...> и положите в
# /etc/nginx/sites-available/, затем symlink в sites-enabled/.
#
# Установка (этап 5, на сервере):
#   sudo cp deploy/nginx-damu-dashboard.conf /etc/nginx/sites-available/damu-dashboard
#   sudo ln -s /etc/nginx/sites-available/damu-dashboard /etc/nginx/sites-enabled/
#   sudo nginx -t                # проверка синтаксиса ДО перезапуска
#   sudo systemctl reload nginx
#
# Проверка: сайт открывается по https://<имя> с замочком; http без s
# переадресуется на https.

# Ограничение частоты: зона на 10 МБ (~160 тыс. адресов), 10 запросов/сек
# с одного IP. Случайный зациклившийся скрипт или вкладка не положат сайт.
# Объявляется на уровне http{}, поэтому строка — в /etc/nginx/nginx.conf
# ИЛИ в conf.d/, а не внутри server{} ниже. Приведена здесь для полноты:
#   limit_req_zone $binary_remote_addr zone=damu:10m rate=10r/s;

# HTTP -> HTTPS: внутренняя сеть тоже шифруется, данные финансовые.
server {
    listen 80;
    server_name <имя-сервера-или-адрес>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name <имя-сервера-или-адрес>;

    # Внутренний сертификат компании (выдаёт корпоративный УЦ, не Let's Encrypt —
    # сайт наружу не смотрит). Путь уточнить у админов.
    ssl_certificate     <путь-к-сертификату>/damu.crt;
    ssl_certificate_key <путь-к-ключу>/damu.key;

    # Разумные умолчания протокола; точный набор согласовать с безопасностью.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Лимит запросов из зоны выше. burst=20 — короткий всплеск (открыли
    # несколько вкладок) пропускается, устойчивый поток режется.
    limit_req zone=damu burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8050;

        # Передаём настоящий адрес клиента и протокол — иначе в логах
        # приложения все запросы были бы с 127.0.0.1, а редиректы сломались бы.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
